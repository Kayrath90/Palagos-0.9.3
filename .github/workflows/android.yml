
name: Palagos 0.9.3 - Typfix v2
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Spielcode herunterladen
        uses: actions/checkout@v4

      - name: ZIP entpacken und Bogenanimation gezielt korrigieren
        shell: bash
        run: |
          set -euo pipefail
          unzip -q PALAGOS_Godot_v093_GOLD_BRAUN.zip
          python3 - <<'PY'
          from pathlib import Path
          path = Path('PALAGOS_Godot_v093/scripts/main.gd')
          code = path.read_text(encoding='utf-8')
          fixes = {
              'var top := limbs[limbs.size() - 1]': 'var top: Vector3 = limbs[limbs.size() - 1]',
              'var bottom := limbs[0]': 'var bottom: Vector3 = limbs[0]',
          }
          for old, new in fixes.items():
              if code.count(old) != 1:
                  raise SystemExit(f'Erwartete Codezeile nicht eindeutig gefunden: {old}')
              code = code.replace(old, new)
          path.write_text(code, encoding='utf-8')
          print('Beide Variablentypen in der Bogenanimation korrigiert.')
          PY
          test -f PALAGOS_Godot_v093/project.godot
          python3 -m unittest discover -s PALAGOS_Godot_v093/tests -p 'test_*.py' -v

      - name: Java 17 vorbereiten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        uses: android-actions/setup-android@v4

      - name: Debug-Signatur erstellen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'

      - name: APK mit Godot 4.7.2 exportieren
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://godot-releases.nbg1.your-objectstorage.com/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./PALAGOS_Godot_v093
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true

      - name: Godot-Skripte und Animationen testen
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$(find "$HOME/.local/share/godot/godot_executable" -type f -name 'Godot*linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --headless --editor --path PALAGOS_Godot_v093 --quit 2>&1 | tee /tmp/palagos-import.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid access|Invalid call' /tmp/palagos-import.log; then
            echo 'Fehler beim Godot-Import'; exit 1
          fi
          for script in smoke_start smoke_models smoke_animation; do
            "$GODOT" --headless --path PALAGOS_Godot_v093 --script "res://tests/${script}.gd" 2>&1 | tee "/tmp/${script}.log"
            if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid access|Invalid call|SMOKE_FAIL|MODEL_SMOKE_FAIL|ANIMATION_SMOKE_FAIL' "/tmp/${script}.log"; then
              echo "Test ${script} fehlgeschlagen"; exit 1
            fi
          done
          grep -q 'PALAGOS_09_SMOKE_PASS' /tmp/smoke_start.log
          grep -q 'PALAGOS_093_MODELS_PASS' /tmp/smoke_models.log
          grep -q 'PALAGOS_093_ANIMATION_PASS' /tmp/smoke_animation.log

      - name: APK zum Download freigeben
        uses: actions/upload-artifact@v4
        with:
          name: Palagos-0.9.3-Android-Typfix-v2
          path: '**/Palagos-v093-Android-debug.apk'
          if-no-files-found: error

